[project]
name = "mikey"
version = "0.1.0"
description = "M.I.K.E.Y — Multimodal Intelligent Knowledge & Execution Engine for You"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.8",
    "pymupdf>=1.28.0",
]

[project.optional-dependencies]
# `uv sync --extra tui`. The HUD is a second surface, not a replacement: everything
# it does is also reachable from the plain CLI, so a machine that cannot run a
# full-screen terminal app loses nothing but the dashboard.
tui = [
    "textual>=0.80",
]
# `uv sync --extra voice`. Kept optional: M.I.K.E.Y is fully usable as text, and
# these pull a speech model and a PortAudio binding that a headless install has no
# use for. Speech recognition runs on-device (no audio ever leaves the machine).
voice = [
    "faster-whisper>=1.0",
    "sounddevice>=0.4",
    "soundfile>=0.12",
    "numpy>=1.26",
    "edge-tts>=6.1",
    # The upper bounds are not caution, they are three wheels that do not run on
    # this machine, found by running them: ctranslate2 4.8.1 segfaults the moment a
    # model is loaded (any compute type, any forced ISA), 4.7.0 ships a broken ROCm
    # DLL path, and onnxruntime 1.28 fails its DLL init. The pinned versions load
    # and transcribe correctly here. Revisit on a new machine, not before.
    "ctranslate2>=4.5,<4.6",
    "onnxruntime>=1.20,<1.21",
    # ctranslate2 4.5 imports pkg_resources at module load; setuptools 81 removed it.
    "setuptools<81",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "mypy>=1.11",
    "ruff>=0.6",
]

[project.scripts]
mikey = "apps.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "executor", "apps", "training"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
